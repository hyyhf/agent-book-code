[project]
name = "agent-book-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lark-oapi>=1.4.23",
    "openai>=2.32.0",
    "openai-agents>=0.14.3",
    "python-dotenv>=1.2.2",
    "textual[syntax]>=8.2.4",
]

[project.scripts]
fh = "funharness.src.__main__:main"
fh-feishu = "funharness.src.channels.feishu:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["funharness*"]

[tool.uv]
package = true
