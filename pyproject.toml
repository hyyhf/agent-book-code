[project]
name = "agent-book-code"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "lark-oapi>=1.4.23",
    "openai>=2.32.0",
    "openai-agents>=0.14.3",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "python-docx>=1.2.0",
    "pypdf>=6.4.0",
    "textual[syntax]>=8.2.4",
    "scrapling[fetchers]>=0.4.8",
    "qqbot-agent-sdk>=1.2.2",
    "qrcode>=8.0",
    "cryptography>=44.0.0",
]

[project.scripts]
fh = "funharness.src.__main__:main"
fh-feishu = "funharness.src.channels.feishu:main"
fh-weixin = "funharness.src.channels.weixin:main"
fh-weixin-login = "funharness.src.channels.weixin:login_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["funharness*"]

[tool.uv]
package = true
